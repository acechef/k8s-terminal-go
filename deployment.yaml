apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-terminal-account
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-terminal-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get", "list", "create"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-terminal-binding
subjects:
- kind: ServiceAccount
  name: k8s-terminal-account
  namespace: default
roleRef:
  kind: ClusterRole
  name: k8s-terminal-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-terminal-go
  namespace: default
  labels:
    app: k8s-terminal-go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-terminal-go
  template:
    metadata:
      labels:
        app: k8s-terminal-go
    spec:
      serviceAccountName: k8s-terminal-account
      containers:
      - name: k8s-terminal-go
        image: harborv.com:888/library/k8s-terminal-go:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-terminal-service
  namespace: default
spec:
  selector:
    app: k8s-terminal-go
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
